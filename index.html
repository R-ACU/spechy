<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spechy</title>
    <!-- Paint the ground of the last theme before the bundle runs (src/lib/theme.ts caches it), so
         the window never shows another theme first. Falls back to the ASCII ground of a fresh install.
         theme.ts removes this inline background once the stylesheets are in. -->
    <script>
      (function () {
        var bg = "#0b0b0b";
        try { var v = localStorage.getItem("spechy.bg"); if (/^#[0-9a-f]{6}$/i.test(v || "")) bg = v; } catch (e) {}
        var r = document.documentElement;
        r.style.background = bg;
        var n = parseInt(bg.slice(1), 16);
        r.style.colorScheme = ((n >> 16) & 255) * 0.299 + ((n >> 8) & 255) * 0.587 + (n & 255) * 0.114 > 128 ? "light" : "dark";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
